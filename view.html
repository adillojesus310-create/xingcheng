<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📍 她的行程</title>
<link rel="stylesheet" href="common.css">
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>📍 她的行程</h1>
    <div class="date-display" id="dateDisplay"></div>
  </div>
  <div class="subtitle" id="lunarDisplay">实时查看她的位置和今日安排</div>
</div>

<div class="location-card featured" id="locationCard">
  <div class="loc-row top">
    <div class="loc-icon lg">📍</div>
    <div class="loc-info">
      <div class="loc-name lg" id="locName">加载中...</div>
      <div class="loc-addr lg" id="locAddr">--</div>
      <div class="loc-meta">
        <span class="loc-time" id="locTime"></span>
        <span class="loc-badge offline" id="locBadge">离线</span>
      </div>
    </div>
  </div>
  <div class="loc-coords" id="locCoords">--</div>
</div>

<div class="map-container h220" id="mapBox">
  <iframe id="mapFrame" style="display:none;" allowfullscreen></iframe>
  <div class="map-placeholder" id="mapPlaceholder">
    <div class="icon">🗺️</div>
    <div class="hint">等待位置共享</div>
  </div>
</div>

<div class="map-link-box" id="mapDirectLinkBox" style="display:none;">
  <a id="mapDirectLink" href="#" target="_blank">📱 点此在手机地图查看</a>
</div>

<div class="section-title">⏰ 今日安排</div>
<div class="timeline" id="timeline"></div>

<div class="note-section">
  <div class="note-section-title">📝 备忘</div>
  <div class="note-content" id="noteContent">暂无</div>
</div>

<div class="live-bar">
  <div class="live-dot off" id="liveDot"></div>
  <span id="liveText">加载中</span>
  · 最后更新: <span id="lastUpdate">--</span>
</div>

<div class="footer">❤️</div>

<script src="common.js"></script>
<script>
const U = window.HermesUtil;
let lastLocKey = '';

function updateLive(online) {
  document.getElementById('liveDot').className = online ? 'live-dot' : 'live-dot off';
  document.getElementById('liveText').textContent = online ? '实时连接' : '等待连接';
  document.getElementById('lastUpdate').textContent = U.formatTime(new Date());
}

function renderLocation(loc) {
  const $ = id => document.getElementById(id);
  const ph = $('mapPlaceholder');
  const mf = $('mapFrame');
  const dlBox = $('mapDirectLinkBox');
  const dl = $('mapDirectLink');

  if (!loc || !loc.lat) {
    $('locName').textContent = '位置未共享';
    $('locAddr').textContent = '等待她开启位置';
    $('locTime').textContent = '';
    $('locBadge').className = 'loc-badge offline';
    $('locBadge').textContent = '离线';
    $('locCoords').textContent = '--';
    ph.style.display = 'flex';
    mf.style.display = 'none';
    dlBox.style.display = 'none';
    lastLocKey = '';
    return;
  }

  $('locName').textContent = '正在共享位置';
  $('locAddr').textContent = '精度 ±' + Math.round(loc.accuracy) + '米';
  $('locTime').textContent = '更新于 ' + (loc.time || '--');
  $('locBadge').className = 'loc-badge online';
  $('locBadge').textContent = '📍 在线';
  $('locCoords').textContent = loc.lat.toFixed(6) + ', ' + loc.lng.toFixed(6);

  ph.style.display = 'none';
  mf.style.display = 'block';
  dlBox.style.display = 'block';

  // 只有位置真变了才换 iframe.src,避免地图反复刷
  const key = loc.lat.toFixed(5) + ',' + loc.lng.toFixed(5);
  if (key !== lastLocKey) {
    mf.src = U.osmEmbedUrl(loc);
    lastLocKey = key;
  }
  dl.href = U.amapUrl(loc, '她的位置');
}

function render(data) {
  if (!data) return;
  renderLocation(data.loc);
  U.renderTimeline(document.getElementById('timeline'), data.items, { emptyText: '今天暂无安排' });
  document.getElementById('noteContent').textContent = data.note || '暂无备忘';
}

async function poll() {
  const result = await U.fetchData();
  if (result === null) {
    updateLive(false);
  } else {
    updateLive(true);
    if (!result.unchanged) render(result.data);
    document.getElementById('lastUpdate').textContent = U.formatTime(new Date());
  }
  setTimeout(poll, 3000);
}

document.getElementById('dateDisplay').textContent = U.todayStr();
const lunar = U.lunarStr();
if (lunar) document.getElementById('lunarDisplay').textContent = lunar;
poll();
</script>
</body>
</html>
