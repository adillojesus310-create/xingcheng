<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📋 今日行程</title>
<link rel="stylesheet" href="common.css">
<style>
/* index 专有样式 */
.admin-panel {
  display: none; position: fixed; bottom: 0; left: 0; right: 0;
  background: #141420; border-top: 1px solid #2a2a4a;
  padding: 16px 20px; padding-bottom: calc(16px + env(safe-area-inset-bottom));
  z-index: 100;
}
.admin-panel.show { display: block; }

.admin-toggle {
  position: fixed; bottom: 16px; right: 16px;
  width: 48px; height: 48px;
  background: #1a1a2e; border: 1px solid #3a3a5a; border-radius: 50%;
  color: #888; font-size: 20px; cursor: pointer; z-index: 101;
  display: flex; align-items: center; justify-content: center;
  opacity: 0.5; transition: opacity 0.2s;
}
.admin-toggle:active { opacity: 1; }

.admin-actions { display: flex; gap: 8px; margin-top: 10px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>📋 今日行程</h1>
    <div class="date-display" id="dateDisplay"></div>
  </div>
  <div class="lunar-display" id="lunarDisplay"></div>
</div>

<div class="location-card" id="locationCard">
  <div class="loc-row">
    <div class="loc-icon">📍</div>
    <div class="loc-info">
      <div class="loc-name" id="locationName">位置加载中...</div>
      <div class="loc-addr" id="locationAddress">等待共享</div>
      <div class="loc-time" id="locationTime"></div>
    </div>
    <span class="loc-badge" id="locationStatus">实时</span>
  </div>
</div>

<div class="map-container h200" id="mapContainer">
  <iframe id="mapFrame" style="display:none;" allowfullscreen></iframe>
  <div class="map-placeholder" id="mapPlaceholder">
    <div class="icon">🗺️</div>
    <div class="hint">等待位置数据</div>
  </div>
</div>

<div class="map-link-box" id="mapDirectLinkBox" style="display:none;">
  <a id="mapDirectLink" href="#" target="_blank">📱 点此在手机地图查看</a>
</div>

<div class="section-title">⏰ 今日安排</div>
<div class="timeline" id="timeline"></div>

<div class="note-section">
  <div class="note-section-title">📝 备忘</div>
  <div class="note-content" id="noteContent">暂无备忘录</div>
</div>

<div class="live-bar">
  <div class="live-dot off" id="liveDot"></div>
  <span id="liveStatus">离线</span>
</div>

<div class="footer">❤️  &nbsp;·&nbsp; 给男朋友看的位置</div>

<button class="admin-toggle" id="adminToggle" aria-label="管理员">✏️</button>

<div class="admin-panel" id="adminPanel">
  <textarea class="input-base area block" id="adminInput" rows="5" placeholder="更新行程

格式示例：
14:00 健身房 @ 万象城
19:00 吃饭 @ 万达
21:30 预计到家

===
备忘：记得带钥匙"></textarea>
  <div class="admin-actions">
    <button class="btn primary" style="flex:1;" id="adminSave">更新</button>
    <button class="btn" style="flex:1;" id="adminCancel">取消</button>
  </div>
</div>

<script src="common.js"></script>
<script>
const U = window.HermesUtil;
const $ = id => document.getElementById(id);

let state = { items: [], note: '', loc: null };
let lastLocKey = '';

function updateLive(online) {
  $('liveDot').className = online ? 'live-dot' : 'live-dot off';
  $('liveStatus').textContent = online ? '同步中' : '离线';
}

function renderLocation(loc) {
  if (!loc || !loc.lat) {
    $('locationName').textContent = '位置未共享';
    $('locationAddress').textContent = '页面打开后自动获取';
    $('locationTime').textContent = '';
    $('locationStatus').className = 'loc-badge';
    $('locationStatus').textContent = '离线';
    $('mapPlaceholder').style.display = 'flex';
    $('mapFrame').style.display = 'none';
    $('mapDirectLinkBox').style.display = 'none';
    lastLocKey = '';
    return;
  }
  $('locationName').textContent = '正在共享位置';
  $('locationAddress').textContent = '精度 ±' + Math.round(loc.accuracy) + '米';
  $('locationTime').textContent = '更新于 ' + (loc.time || '');
  $('locationStatus').className = 'loc-badge online';
  $('locationStatus').textContent = '📍 在线';

  $('mapPlaceholder').style.display = 'none';
  $('mapFrame').style.display = 'block';
  $('mapDirectLinkBox').style.display = 'block';

  const key = loc.lat.toFixed(5) + ',' + loc.lng.toFixed(5);
  if (key !== lastLocKey) {
    $('mapFrame').src = U.osmEmbedUrl(loc);
    lastLocKey = key;
  }
  $('mapDirectLink').href = U.amapUrl(loc, '她的位置');
}

function render() {
  U.renderTimeline($('timeline'), state.items, { emptyText: '今天暂无安排，点击 ✏️ 添加' });
  $('noteContent').textContent = state.note || '暂无备忘录';
  renderLocation(state.loc);
}

// ===== 初始加载 =====
async function initLoad() {
  const r = await U.fetchData();
  if (r && !r.unchanged && r.data) {
    state = { items: r.data.items || [], note: r.data.note || '', loc: r.data.loc || null };
    updateLive(true);
  }
  render();
}

// ===== 管理面板 =====
let adminVisible = false;
$('adminToggle').addEventListener('click', () => {
  if (!watchId) startLocationShare();
  adminVisible = !adminVisible;
  $('adminPanel').classList.toggle('show', adminVisible);
  if (adminVisible) {
    $('adminInput').value = U.stringifySchedule(state);
    $('adminInput').focus();
    $('adminToggle').textContent = '✕';
  } else {
    $('adminToggle').textContent = '✏️';
  }
});

$('adminSave').addEventListener('click', async () => {
  const text = $('adminInput').value.trim();
  if (!text) return;
  const parsed = U.parseScheduleText(text);
  if (parsed.items.length === 0) {
    alert('请输入有效格式，如：\n14:00 健身房 @ 万象城');
    return;
  }
  state.items = parsed.items;
  state.note = parsed.note;
  render();
  await U.postData(state);
  adminVisible = false;
  $('adminPanel').classList.remove('show');
  $('adminToggle').textContent = '✏️';
});

$('adminCancel').addEventListener('click', () => {
  adminVisible = false;
  $('adminPanel').classList.remove('show');
  $('adminToggle').textContent = '✏️';
});

// ===== 位置共享 =====
let watchId = null;
let lastPushTime = 0;

function startLocationShare() {
  if (!navigator.geolocation) {
    $('locationName').textContent = '浏览器不支持定位';
    return;
  }

  async function onPosition(pos) {
    const loc = {
      lat: pos.coords.latitude,
      lng: pos.coords.longitude,
      accuracy: pos.coords.accuracy,
      time: U.formatTime(new Date())
    };
    state.loc = loc;
    renderLocation(loc);
    const now = Date.now();
    if (now - lastPushTime > 5000) {
      lastPushTime = now;
      U.postData(state).then(ok => updateLive(ok));
    }
  }

  function onError(err) {
    console.warn('定位失败:', err.message);
    $('locationName').textContent = '无法获取位置';
    $('locationAddress').textContent = '请开启定位权限后刷新页面';
  }

  navigator.geolocation.getCurrentPosition(onPosition, onError, {
    enableHighAccuracy: true, timeout: 10000
  });
  watchId = navigator.geolocation.watchPosition(onPosition, onError, {
    enableHighAccuracy: true, timeout: 30000, maximumAge: 5000
  });
  $('locationAddress').textContent = '位置已开启，每5秒更新';
}

// ===== 轮询 =====
async function pollServerData() {
  const r = await U.fetchData();
  if (r === null) {
    updateLive(false);
    return;
  }
  updateLive(true);
  if (!r.unchanged && r.data) {
    // 服务端有更新时合并(位置以本地为准,如果正在共享)
    const newState = { items: r.data.items || [], note: r.data.note || '', loc: r.data.loc };
    if (watchId && state.loc) newState.loc = state.loc;
    state = newState;
    render();
  }
  $('dateDisplay').textContent = U.todayStr();
}

setInterval(pollServerData, 3000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) pollServerData();
});

// 启动
$('dateDisplay').textContent = U.todayStr();
const lunar = U.lunarStr();
if (lunar) $('lunarDisplay').textContent = lunar;
initLoad();
setTimeout(startLocationShare, 1500);
</script>
</body>
</html>
