<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📋 行程管理</title>
<link rel="stylesheet" href="common.css">
<style>
/* admin 专有样式 */
.edit-section {
  margin: 16px; background: #141420; border: 1px solid #2a2a4a;
  border-radius: 12px; overflow: hidden;
}
.edit-tabs { display: flex; border-bottom: 1px solid #2a2a4a; }
.edit-tab {
  flex: 1; padding: 10px; text-align: center; font-size: 13px;
  color: #666; cursor: pointer; border-bottom: 2px solid transparent;
}
.edit-tab.active { color: #4fc3f7; border-bottom-color: #4fc3f7; }
.edit-panel { padding: 12px; display: none; }
.edit-panel.active { display: block; }

.add-row { display: flex; gap: 8px; margin-bottom: 8px; }
.add-row .time-input { width: 70px; flex-shrink: 0; text-align: center; }
.add-row .text-input { flex: 1; }

.add-btn {
  width: 100%; padding: 10px; border: 1px dashed #3a3a5a;
  border-radius: 8px; background: transparent;
  color: #555; font-size: 13px; cursor: pointer; text-align: center;
  margin-bottom: 8px;
}
.add-btn:active { border-color: #4fc3f7; color: #4fc3f7; }

.loc-actions { display: flex; gap: 8px; margin-top: 10px; }

.log-section {
  margin: 0 16px 16px; background: #141420; border: 1px solid #2a2a4a;
  border-radius: 12px; padding: 12px 16px; display: none;
}
.log-section.show { display: block; }
.log-title { font-size: 12px; color: #555; margin-bottom: 6px; cursor: pointer; }
.log-entry { font-size: 11px; color: #444; padding: 2px 0; font-family: monospace; }

.share-link {
  margin: 12px 16px; padding: 12px 16px;
  background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 12px;
  display: flex; align-items: center; gap: 10px;
}
.share-link input {
  flex: 1; background: transparent; border: none; color: #4fc3f7;
  font-size: 12px; font-family: monospace; outline: none; min-width: 0;
}
.share-link .copy-btn {
  flex-shrink: 0; padding: 6px 14px; border: 1px solid #4fc3f7;
  border-radius: 6px; color: #4fc3f7; font-size: 12px;
  cursor: pointer; background: transparent;
}

.share-hint { text-align: center; padding: 8px 16px; font-size: 12px; color: #555; }
</style>
</head>
<body>

<!-- Token 设置（首次使用弹出） -->
<div id="tokenSetup" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:#141420;border:1px solid #2a2a4a;border-radius:12px;padding:24px;margin:20px;max-width:400px;text-align:center;">
    <div style="font-size:40px;margin-bottom:12px;">🔐</div>
    <h3 style="color:#fff;margin:0 0 8px;">首次使用 · 输入 GitHub Token</h3>
    <p style="color:#666;font-size:12px;margin:0 0 16px;">Token 只存在你的浏览器里，不上传服务器</p>
    <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxx" style="width:100%;padding:10px;background:#0a0a14;border:1px solid #2a2a4a;border-radius:6px;color:#4fc3f7;font-size:13px;text-align:center;box-sizing:border-box;">
    <p style="color:#555;font-size:11px;margin:8px 0 16px;"><a href="https://github.com/settings/tokens" target="_blank" style="color:#4fc3f7;">获取 Token →</a> 需要勾选 repo 权限</p>
    <button id="saveToken" style="width:100%;padding:10px;background:#4fc3f7;color:#000;border:none;border-radius:6px;font-size:14px;font-weight:bold;cursor:pointer;">✅ 确认</button>
    <p id="tokenError" style="color:#f44;font-size:11px;margin:8px 0 0;display:none;"></p>
  </div>
</div>

<script>
(function() {
  var el = document.getElementById('tokenSetup');
  if (!localStorage.getItem('gh_token')) {
    el.style.display = 'flex';
    document.getElementById('saveToken').onclick = function() {
      var v = document.getElementById('tokenInput').value.trim();
      if (!v) { document.getElementById('tokenError').style.display='block'; document.getElementById('tokenError').textContent='请输入 Token'; return; }
      if (!v.startsWith('ghp_')) { document.getElementById('tokenError').style.display='block'; document.getElementById('tokenError').textContent='Token 格式不对，应以 ghp_ 开头'; return; }
      localStorage.setItem('gh_token', v);
      window.GITHUB_TOKEN_FROM_CONFIG = v;
      el.style.display = 'none';
      document.getElementById('tokenError').style.display = 'none';
      // 不 reload，直接初始化
      if (typeof initAdmin === 'function') initAdmin();
      else location.reload();
    };
  } else {
    el.style.display = 'none';
  }
})();
</script>

<div class="header">
  <div class="header-top">
    <h1>📋 行程管理</h1>
    <div class="date-display" id="dateDisplay"></div>
  </div>
</div>

<!-- 共享链接 -->
<div class="share-link">
  <span style="color:#888;font-size:12px;flex-shrink:0;">🔗</span>
  <input type="text" id="viewerLink" readonly value="加载中...">
  <button class="copy-btn" id="copyLink">复制</button>
</div>

<!-- 位置共享 -->
<div class="location-card">
  <div class="loc-row">
    <div class="loc-icon sm">📍</div>
    <div class="loc-info">
      <div class="loc-name" id="locName">尚未获取位置</div>
      <div class="loc-addr" id="locAddr">点击"开始共享"</div>
      <div class="loc-time" id="locTime"></div>
    </div>
    <span class="loc-badge inactive" id="locBadge">离线</span>
  </div>
  <div class="loc-coords" id="locCoords">--</div>
  <div class="loc-actions">
    <button class="btn primary" style="flex:1;" id="startShare">📍 开始共享位置</button>
    <button class="btn danger" style="flex:1;display:none;" id="stopShare">停止</button>
  </div>
</div>

<!-- 行程编辑 -->
<div class="edit-section">
  <div class="edit-tabs">
    <div class="edit-tab active" data-tab="quick">快速添加</div>
    <div class="edit-tab" data-tab="full">编辑全部</div>
  </div>

  <div class="edit-panel active" id="panel-quick">
    <div class="add-row">
      <input type="text" class="input-base time-input" id="quickTime" placeholder="14:00">
      <input type="text" class="input-base text-input" id="quickTitle" placeholder="事件 (如: 健身房 @ 万象城)">
    </div>
    <button class="add-btn" id="addQuickItem">+ 添加到行程</button>

    <div class="section-title" style="padding:8px 0 4px;font-size:12px;">当前行程</div>
    <div id="quickList"></div>

    <div style="margin-top:8px;">
      <input type="text" class="input-base block" id="quickNote" placeholder="备忘 (如: 记得带钥匙)">
    </div>

    <button class="btn primary lg block" id="quickSave" style="margin-top:10px;">💾 保存行程</button>
  </div>

  <div class="edit-panel" id="panel-full">
    <textarea class="input-base area block" id="fullInput" rows="7" placeholder="格式：&#10;14:00 健身房 @ 万象城&#10;19:00 吃饭 @ 万达&#10;21:30 预计到家&#10;&#10;===&#10;备忘：记得带钥匙" style="margin-bottom:10px;"></textarea>
    <button class="btn primary lg block" id="fullSave">💾 保存全部</button>
  </div>
</div>

<div class="log-section" id="logSection">
  <div class="log-title" id="logToggle">📋 同步日志 (点击展开)</div>
  <div id="logContent"></div>
</div>

<div class="share-hint">男朋友打开查看端链接就能看到你的位置和行程</div>
<div class="footer">❤️ 行程小助手</div>

<!-- Token 管理：优先 localStorage，否则尝试 config.js -->
<script>
(function() {
  var tok = localStorage.getItem('gh_token');
  if (tok) {
    window.GITHUB_TOKEN_FROM_CONFIG = tok;
  }
})();
</script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
const U = window.HermesUtil;
const $ = id => document.getElementById(id);

// ===== 数据状态 =====
let state = { items: [], note: '', loc: null };

async function loadInitial() {
  const r = await U.fetchData();
  if (r && !r.unchanged && r.data) {
    state = { items: r.data.items || [], note: r.data.note || '', loc: r.data.loc || null };
  }
}

async function saveState() {
  const ok = await U.postData(state);
  addLog(ok ? '✅ 已保存到服务器' : '⚠️ 保存失败,请检查网络');
}

// ===== 位置共享 =====
let watchId = null;

function updateLocationUI(loc) {
  if (!loc) {
    $('locName').textContent = '尚未获取位置';
    $('locAddr').textContent = '点击"开始共享位置"';
    $('locTime').textContent = '';
    $('locBadge').className = 'loc-badge inactive';
    $('locBadge').textContent = '离线';
    $('locCoords').textContent = '--';
    return;
  }
  $('locName').textContent = '当前共享位置';
  $('locAddr').textContent = '精度 ±' + Math.round(loc.accuracy) + '米';
  $('locTime').textContent = '更新于 ' + (loc.time || U.formatTime(new Date()));
  $('locBadge').className = 'loc-badge active';
  $('locBadge').textContent = '📍 在线';
  $('locCoords').textContent = loc.lat.toFixed(6) + ', ' + loc.lng.toFixed(6);
}

async function onPosition(pos) {
  const loc = {
    lat: pos.coords.latitude,
    lng: pos.coords.longitude,
    accuracy: pos.coords.accuracy,
    time: U.formatTime(new Date())
  };
  state.loc = loc;
  updateLocationUI(loc);
  $('startShare').style.display = 'none';
  $('stopShare').style.display = 'block';
  await U.postData(state);
  addLog('位置已更新: ' + loc.lat.toFixed(4) + ', ' + loc.lng.toFixed(4));
}

function onPositionError(err) {
  alert('获取位置失败: ' + err.message + '\n请检查定位权限是否开启');
}

function startSharing() {
  if (!navigator.geolocation) { alert('浏览器不支持定位'); return; }
  navigator.geolocation.getCurrentPosition(onPosition, onPositionError, {
    enableHighAccuracy: true, timeout: 15000
  });
  if (watchId) navigator.geolocation.clearWatch(watchId);
  watchId = navigator.geolocation.watchPosition(onPosition, onPositionError, {
    enableHighAccuracy: true, timeout: 30000, maximumAge: 10000
  });
}

function stopSharing() {
  if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  $('startShare').style.display = 'block';
  $('stopShare').style.display = 'none';
  addLog('位置共享已停止');
}

// ===== 行程列表 =====
function renderList() {
  U.renderTimeline($('quickList'), state.items, { deletable: true, emptyText: '暂无行程' });
  $('quickList').querySelectorAll('.timeline-del').forEach(btn => {
    btn.addEventListener('click', async () => {
      const idx = parseInt(btn.dataset.idx);
      state.items.splice(idx, 1);
      renderList();
      await saveState();
    });
  });
}

// ===== Tab 切换 =====
document.querySelectorAll('.edit-tab').forEach(tab => {
  tab.addEventListener('click', function () {
    document.querySelectorAll('.edit-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.edit-panel').forEach(p => p.classList.remove('active'));
    this.classList.add('active');
    $('panel-' + this.dataset.tab).classList.add('active');
    if (this.dataset.tab === 'full') {
      $('fullInput').value = U.stringifySchedule(state);
    }
  });
});

// ===== 快速添加 =====
$('addQuickItem').addEventListener('click', async () => {
  const time = $('quickTime').value.trim();
  const title = $('quickTitle').value.trim();
  if (!time || !title) { alert('请输入时间和事件'); return; }
  let cleanTitle = title, desc = '';
  const atIdx = title.indexOf(' @');
  if (atIdx >= 0) {
    cleanTitle = title.slice(0, atIdx).trim();
    desc = '@' + title.slice(atIdx + 2).trim();
  }
  state.items.push({ time, title: cleanTitle, desc, done: false });
  state.items.sort((a, b) => a.time.localeCompare(b.time));
  renderList();
  $('quickTime').value = '';
  $('quickTitle').value = '';
  addLog('已添加: ' + time + ' ' + cleanTitle);
  await saveState();
});

$('quickSave').addEventListener('click', async () => {
  state.note = $('quickNote').value.trim();
  await saveState();
  addLog('行程已保存');
});

$('fullSave').addEventListener('click', async () => {
  const text = $('fullInput').value.trim();
  if (!text) { alert('请输入行程'); return; }
  const parsed = U.parseScheduleText(text);
  if (parsed.items.length === 0) { alert('请输入有效行程'); return; }
  state.items = parsed.items;
  state.note = parsed.note;
  renderList();
  $('quickNote').value = parsed.note;
  document.querySelector('[data-tab="quick"]').click();
  addLog('已更新 ' + parsed.items.length + ' 条行程');
  await saveState();
});

// ===== 日志 =====
function addLog(msg) {
  const el = $('logContent');
  const time = U.formatTime(new Date());
  el.innerHTML = '<div class="log-entry">[' + time + '] ' + U.escapeHtml(msg) + '</div>' + el.innerHTML;
  $('logSection').classList.add('show');
}

$('logToggle').addEventListener('click', () => {
  const c = $('logContent');
  c.style.display = c.style.display === 'none' ? 'block' : 'none';
});

// ===== 复制链接 =====
function updateSharedLink() {
  const viewerUrl = window.location.href
    .replace('admin.html', 'view.html')
    .replace(/\/+$/, '')
    .split('?')[0].split('#')[0];
  $('viewerLink').value = viewerUrl;
}

$('copyLink').addEventListener('click', function () {
  const input = $('viewerLink');
  input.select();
  input.setSelectionRange(0, 99999);
  const done = () => {
    this.textContent = '已复制';
    setTimeout(() => { this.textContent = '复制'; }, 2000);
  };
  if (navigator.clipboard) {
    navigator.clipboard.writeText(input.value).then(done).catch(done);
  } else {
    document.execCommand('copy'); done();
  }
});

// ===== 初始化 =====
async function initAdmin() {
  $('dateDisplay').textContent = U.todayStr();
  updateSharedLink();
  await loadInitial();
  renderList();
  if (state.note) $('quickNote').value = state.note;
  if (state.loc) {
    updateLocationUI(state.loc);
    $('startShare').style.display = 'none';
    $('stopShare').style.display = 'block';
  }
}
initAdmin();

$('startShare').addEventListener('click', startSharing);
$('stopShare').addEventListener('click', stopSharing);

setInterval(() => { $('dateDisplay').textContent = U.todayStr(); }, 60000);

window.addEventListener('beforeunload', () => {
  if (watchId) navigator.geolocation.clearWatch(watchId);
});
</script>
</body>
</html>
